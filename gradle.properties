org.gradle.daemon=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.jetbrains.intellij.buildFeature.selfUpdateCheck=false
kotlin.stdlib.default.dependency=false

# ---------------------------------------------------------------------------
# Marketplace listing. These are published publicly on the plugin page.
# A contact email is REQUIRED by JetBrains Marketplace review.
# ---------------------------------------------------------------------------
pluginVendorName=pi-gui
pluginVendorEmail=
pluginVendorUrl=

# Release channel for `publishPlugin`: "default" is the public stable channel.
# Use a named channel (e.g. "eap") to publish a pre-release that users must opt into.
pluginChannel=default
