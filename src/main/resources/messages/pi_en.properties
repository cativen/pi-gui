credentials.consent.title=Allow access to AI credentials?
credentials.consent.message=Pi GUI can import and use local AI provider credentials.\n\nIf you allow access, Pi GUI may read:\n• ~/.cc-switch/cc-switch.db, ~/.cc-switch/config.json, or a cc-switch.db file you select\n• Environment variables ANTHROPIC_AUTH_TOKEN, ANTHROPIC_API_KEY, and OPENAI_API_KEY\n• Provider base URLs and model names\n\nWhy: imported values are copied to ~/.pi/agent/providers.import.json and managed entries in ~/.pi/agent/models.json. The listed environment credentials may be passed to the locally installed pi CLI. This lets pi authenticate with the provider you select.\n\nCredentials remain on this computer. Pi GUI does not send them to the plugin developer and does not collect telemetry. The pi CLI sends a credential only to the selected AI provider when that provider is used.\n\nIf you choose Not Now, Pi GUI will not read these credential files or AI environment variables, and credential import remains disabled.
credentials.consent.allow=Allow Credential Access
credentials.consent.deny=Not Now
