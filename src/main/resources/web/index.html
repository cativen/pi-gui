<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    No remote origins are ever contacted: the whole app is these three local files plus HTML
    produced by the plugin. The policy below makes that a guarantee rather than a convention.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline' 'self'; script-src 'self'; img-src data:;">
  <title>Pi GUI</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div id="root">
  <aside id="sidebar">
    <div id="sessions" class="sessions"></div>
  </aside>

  <main id="main">
    <div id="statusbar">
      <span id="status"></span>
      <span id="branch" class="branch" hidden></span>
    </div>

    <div id="transcript" class="transcript">
      <div id="empty" class="empty">
        <div class="glyph">&pi;</div>
        <div class="empty-title"></div>
        <div class="empty-path"></div>
      </div>
      <div id="messages"></div>
      <div id="streaming"></div>
    </div>

    <div id="edits" class="edits" hidden></div>

    <div id="composer">
      <div id="attachments" class="attachments" hidden></div>
      <div id="command-popup" class="command-popup" hidden></div>
      <div id="input-shell">
        <textarea id="input" rows="3" spellcheck="false"></textarea>
      </div>
      <div id="controls">
        <button id="attach" class="icon-btn" title="">+</button>
        <select id="provider" class="combo"></select>
        <select id="model" class="combo"></select>
        <select id="thinking" class="combo"></select>
        <span class="spacer"></span>
        <span id="context" class="context" hidden></span>
        <button id="compact" class="icon-btn" title="">⌄</button>
        <button id="stop" class="icon-btn danger" title="" hidden>■</button>
        <button id="send" class="icon-btn primary" title="">▶</button>
      </div>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
