<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
  <title>Pi GUI settings</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="settings-app">
<div id="settings-root">
  <aside class="settings-sidebar">
    <div class="settings-brand"><span class="settings-logo">π</span><span id="settings-title">Pi GUI</span></div>
    <nav id="settings-nav" aria-label="Settings"></nav>
    <button id="reset-settings" class="nav-reset" type="button"></button>
  </aside>

  <main class="settings-main">
    <div id="embedded-toolbar" class="embedded-toolbar" hidden>
      <button id="settings-back" class="embedded-back" type="button"></button>
      <span id="settings-save-state" class="save-state" role="status" aria-live="polite"></span>
    </div>
    <section class="settings-page active" data-page="general">
      <header class="page-heading"><h1 data-label="settings.tab.general"></h1><p data-label="settings.general.description"></p></header>
      <div class="settings-card">
        <div class="card-heading"><h2 data-label="settings.appearance"></h2><p data-label="settings.appearance.description"></p></div>
        <div id="theme-options" class="choice-grid three"></div>
      </div>
      <div class="settings-card">
        <div class="card-heading"><h2 data-label="settings.conversation"></h2><p data-label="settings.conversation.description"></p></div>
        <div id="conversation-options" class="setting-list"></div>
        <div class="range-row">
          <div><strong data-label="settings.fontSize"></strong><span data-label="settings.fontSize.description"></span></div>
          <div class="range-control"><input id="font-size" type="range"><output id="font-size-value"></output></div>
        </div>
      </div>
      <div class="settings-card">
        <div class="card-heading"><h2 data-label="settings.language"></h2><p data-label="settings.language.description"></p></div>
        <div id="language-options" class="choice-grid three"></div>
      </div>
    </section>

    <section class="settings-page" data-page="providers">
      <header class="page-heading page-heading-actions"><div><h1 data-label="settings.tab.providers"></h1><p data-label="settings.providers.description"></p></div><div class="header-actions"><button id="import-provider" class="button primary" data-busy-area="providers" type="button"></button><button id="import-provider-db" class="button" data-busy-area="providers" type="button"></button></div></header>
      <div id="providers-status" class="inline-status" role="status"></div>
      <div id="providers-list" class="resource-sections"></div>
    </section>

    <section class="settings-page" data-page="skills">
      <header class="page-heading page-heading-actions"><div><h1 data-label="settings.tab.skills"></h1><p data-label="settings.skills.description"></p></div><button id="add-skill" class="button primary" data-busy-area="skills" type="button"></button></header>
      <div id="skills-status" class="inline-status" role="status"></div>
      <div id="skills-list" class="resource-grid"></div>
    </section>

    <section class="settings-page" data-page="plugins">
      <header class="page-heading page-heading-actions"><div><h1 data-label="settings.tab.plugins"></h1><p data-label="settings.plugins.description"></p></div><button id="refresh-packages" class="button icon-button" type="button"></button></header>
      <div class="settings-card install-card">
        <div class="card-heading"><h2 data-label="plugins.add"></h2><button id="open-packages" class="text-link" type="button">pi.dev/packages ↗</button></div>
        <label class="field"><span data-label="plugins.source"></span><div class="input-action"><input id="package-source" type="text" spellcheck="false" placeholder="npm:@scope/package"><button id="install-package" class="button primary" data-busy-area="plugins" type="button"></button></div><small data-label="plugins.examples"></small></label>
        <div id="package-scopes" class="scope-options"></div>
        <label class="field"><span data-label="plugins.search"></span><div class="input-action"><input id="package-query" type="search"><button id="search-packages" class="button" data-busy-area="plugins" type="button"></button></div></label>
        <div id="package-results" class="search-results"></div>
      </div>
      <div id="plugins-status" class="inline-status" role="status"></div>
      <div class="section-title"><h2 data-label="settings.installed"></h2><span id="packages-summary"></span></div>
      <div id="packages-list" class="resource-grid"></div>
    </section>

    <section class="settings-page" data-page="commit-ai">
      <header class="page-heading"><h1 data-label="settings.tab.commitAi"></h1><p data-label="settings.commitAi.description"></p></header>
      <div class="settings-card compact-card">
        <div class="card-heading"><h2 data-label="settings.commitAi.generation"></h2></div>
        <div class="commit-setting-grid">
          <label class="field"><span data-label="settings.commitAi.model"></span><select id="commit-model" disabled><option data-label="settings.commitAi.followChatModel"></option></select></label>
          <label class="field"><span data-label="settings.commitAi.language"></span><select id="commit-language"><option value="CHINESE" data-label="settings.commitAi.language.zh"></option><option value="ENGLISH" data-label="settings.commitAi.language.en"></option></select></label>
        </div>
      </div>
      <div class="settings-card commit-prompt-card">
        <div class="card-heading"><div><h2 data-label="settings.commitAi.prompt"></h2><p data-label="settings.commitAi.promptHint"></p></div></div>
        <label class="field commit-prompt-field"><span class="sr-only" data-label="settings.commitAi.prompt"></span><textarea id="commit-prompt" rows="6" maxlength="2000"></textarea></label>
        <div class="commit-prompt-footer"><button id="reset-commit-prompt" class="button" type="button" data-label="settings.commitAi.restoreDefault"></button><output id="commit-prompt-count"></output></div>
      </div>
      <div class="settings-info" role="note"><svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.45" aria-hidden="true"><path d="M9 2.5 14 4.4v3.8c0 3.15-2.05 5.7-5 7.3-2.95-1.6-5-4.15-5-7.3V4.4L9 2.5Z"/><path d="m6.8 8.9 1.45 1.45 3-3.15"/></svg><span data-label="settings.commitAi.privacy"></span></div>
    </section>

    <section class="settings-page" data-page="cli">
      <header class="page-heading"><h1 data-label="settings.tab.cli"></h1><p data-label="settings.cli.description"></p></header>
      <div class="settings-card">
        <label class="field"><span data-label="settings.cli.path"></span><div class="input-action"><input id="pi-path" type="text" spellcheck="false"><button id="choose-pi" class="button" type="button" data-label="settings.choose"></button></div></label>
        <div id="pi-detected" class="field-hint"></div>
        <label class="field"><span data-label="settings.cli.extraArgs"></span><input id="extra-args" type="text" spellcheck="false"><small data-label="settings.cli.extraArgs.hint"></small></label>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header"><h2 id="modal-title"></h2><button id="modal-close" class="icon-button close-button" type="button" aria-label="Close">×</button></div>
    <div id="modal-body"></div>
  </div>
</div>
<script src="settings.js"></script>
</body>
</html>
